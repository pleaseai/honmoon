[package]
name = "honmoon-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Honmoon CLI — run / gateway / join"

[[bin]]
name = "honmoon"
path = "src/main.rs"

[dependencies]
honmoon-core.workspace = true
honmoon-proxy.workspace = true
honmoon-mgmt.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `honmoon hook` (Claude Code plugin backend): parse the hook JSON payload the
# shared salt derivation reads the session from (#19/#20).
serde_json.workspace = true
# Every command that reads a policy from a path classifies the document's
# top-level shape before the loader does, so a file that is not a policy is named
# rather than quoted into a log (#198, widened to all three callers in #202).
# Shape only — every policy check stays in `honmoon-core`.
serde_yaml.workspace = true
# `serde::Deserialize` for `serde_yaml::Value`, so that shape check can read the
# *first* document of a stream rather than the whole file: `serde_yaml::from_str`
# refuses a multi-document stream instead of returning its first document, which
# left a `---` line enough to defeat the check (#202). Already a workspace
# dependency — `honmoon-core`, `honmoon-proxy` and `honmoon-mgmt` all carry it —
# so this adds no crate to the build, only a link from this one.
serde.workspace = true

# The cross-transport hook tests re-derive the salt by hand, so they check the
# shared derivation against an independent computation rather than itself.
[dev-dependencies]
hmac.workspace = true
sha2.workspace = true

# Enforced `run` isolation is a Linux-only code path (ADR-0005): empty user +
# network namespaces, with the proxy bridged in over a Unix socket. The
# dependency is `cfg(unix)` rather than Linux-only because the socket pump that
# path is built on is deliberately portable — its tests run on every developer's
# machine — and it names errno constants that only `libc` spells correctly on
# both platforms.
[target.'cfg(unix)'.dependencies]
libc.workspace = true
