[package]
name = "honmoon-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Honmoon policy engine, CEL evaluation, and protocol facts model"

[dependencies]
aho-corasick.workspace = true
cel-interpreter = "0.10"
hmac.workspace = true
percent-encoding.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
sqlparser.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true

# Only for the `O_NOFOLLOW`/`O_NONBLOCK` constants `OpenOptionsExt::custom_flags`
# needs to harden the operator-supplied audit sink open (issue #138); their values
# differ per target, so they cannot be spelled portably by hand. `open_sink` makes no
# syscall through `libc` — it takes two integer constants and the I/O stays `std::fs`,
# as it already was (the test suite does call `libc::mkfifo`, to build a FIFO fixture).
# The crate is already in this workspace's graph via `honmoon-cli`, pinned centrally
# with the rest. Mirrors that crate's `cfg(unix)` gate.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
divan = { version = "5.0.1", package = "codspeed-divan-compat" }

[[bench]]
name = "policy_engine"
harness = false
