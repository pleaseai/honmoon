[package]
name = "honmoon-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Honmoon policy engine, CEL evaluation, and protocol facts model"

[dependencies]
aho-corasick.workspace = true
cel = "0.14"
hmac.workspace = true
percent-encoding.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
sqlparser.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true

# For the flag constants and the directory-relative syscalls that harden the
# operator-supplied audit sink open (issues #138 and #160). `open_sink` no longer
# opens the configured path in one `std::fs` call: closing the symlinked-parent hole
# needs a component-by-component walk, and the primitives for that — `openat`,
# `fstatat`, `readlinkat` — have no `std` equivalent that takes a directory
# descriptor, so this crate does call them directly (the test suite additionally
# calls `libc::mkfifo`, to build a FIFO fixture). Every descriptor they return is
# handed straight to `std::fs::File`, which owns and closes it; no I/O *dependency*
# is added, and the sink is still the only file this crate touches.
# The crate is already in this workspace's graph via `honmoon-cli`, pinned centrally
# with the rest. Mirrors that crate's `cfg(unix)` gate.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
divan = { version = "5.0.1", package = "codspeed-divan-compat" }
# Reading `cargo metadata` in `tests/crate_boundary.rs`. Not a new dependency:
# the crate already builds against `serde_json`, and this entry only makes it
# linkable from an integration test.
serde_json.workspace = true

[[bench]]
name = "policy_engine"
harness = false
