name: Release

# Builds the `honmoon` binary for every supported target, attaches it to a GitHub Release, and
# publishes that Release.
#   - called by release-please.yml → build, upload the tarballs + SHA256SUMS onto the *draft*
#     Release release-please tagged, then publish it
#   - manual run with a tag        → the same, to redo an upload that failed. A Release that is
#     already published is left exactly as it is
#   - manual run with no tag       → dry run: build and keep the artifacts, touch no Release
#
# Whenever a tag is given the checkout is pinned to that tag, in every job, so the artifacts
# can only ever come from the tagged commit — never from whatever ref the run was launched
# against. Without that pin, `gh release upload --clobber` would let a manual run replace a
# published Release's binaries with a build of unrelated source.
#
# release-please owns the version, the tag, and the Release itself, so nothing here creates
# any of them — this workflow uploads into a Release that already exists and then makes it
# visible. It exists as a **draft** (`draft: true` in release-please-config.json), so the last
# step of the last job is what publishes it: a failure anywhere before that leaves a draft,
# which users never see and which never becomes `/releases/latest`, rather than a stable
# Release carrying a CHANGELOG and no binaries (#230).
#
# That draft is also why `force-tag-creation` sits beside it in that config. GitHub does not
# create the tag ref for a draft Release, and release-please pushes `refs/tags/<tag>` itself
# only under that option — without it the three `refs/tags/${{ inputs.tag }}` checkouts below
# resolve nothing.
#
# There is deliberately no `push: tags` trigger: release-please tags as the org App rather than
# as GITHUB_TOKEN, so its tag *does* raise events, and a tag trigger would run this a second
# time alongside release-please.yml's own call and upload every asset twice.
#
# The dashboard MUST be built before `cargo build`. `crates/honmoon-mgmt/build.rs` drops a
# placeholder `index.html` when `apps/dashboard/dist` is missing so a bare `cargo build`
# still links, which means a wrong build order ships a binary serving "Dashboard not built"
# instead of failing. The build job therefore runs `bun run --filter @honmoon/dashboard build`
# first and greps the placeholder marker out of `dist/index.html` before touching cargo.
#
# Binaries are built on native runners only — no cross-compilation toolchain. The workspace
# pulls in `aws-lc-sys` (via rustls), which needs cmake + a C compiler; the hosted runners
# already ship those for their own architecture.
#
# npm packages (@honmoon/cli, @honmoon/policy, @honmoon/api) and the Rust crates are not
# published for v0.1.0 — see docs/releasing.md.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag of the Release to upload the binaries onto.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Upload onto the existing Release with this tag (e.g. v0.1.0).
          Leave empty to dry-run: build everything and touch no Release.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  # Never cancel a release build: a half-published Release is worse than a slow one.
  cancel-in-progress: false

jobs:
  verify-version:
    name: Verify version consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      # Check out the tag itself, not the ref the run was launched against. `inputs.tag` is
      # empty on a dry run, and an empty `ref` is checkout's own default, so only a tagged
      # run is pinned. It is qualified to `refs/tags/` because checkout resolves a bare ref
      # as a branch first (`getCheckoutInfo` tries `origin/<ref>` before `<ref>` as a tag),
      # so a branch named `v0.2.0` would otherwise shadow the tag of that name. Without this a manual run could be launched from any branch whose
      # manifests happen to read the right version and, because the upload uses --clobber,
      # replace a published Release's binaries with artifacts built from that branch. It
      # also pins the automated path: a push landing on main between release-please's tag
      # and this build cannot leak into the tagged artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      # `inputs.tag` is empty only on a manual dry run, which has no tag to be graded
      # against. Every manifest has to agree either way, and the failure message names the
      # one that does not. This is the backstop for release-please's `extra-files` list:
      # a version site it silently failed to rewrite is caught here, before anything ships.
      - name: Check Cargo.toml and every package.json agree
        id: check
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          cargo_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "honmoon-cli") | .version')
          echo "Cargo.toml [workspace.package].version = $cargo_version"

          failed=0
          for manifest in package.json packages/*/package.json apps/*/package.json \
            packages/claude-plugin/.claude-plugin/plugin.json; do
            manifest_version=$(jq -er '.version' "$manifest")
            if [ "$manifest_version" != "$cargo_version" ]; then
              echo "::error file=$manifest::version is $manifest_version but Cargo.toml says $cargo_version"
              failed=1
            fi
          done

          # release-please rewrites the README install snippets through its generic
          # updater, whose missed rewrite is a warning rather than an error — so the
          # version they pin is checked here too. Shipping a Release whose own README
          # tells users to download a version that does not exist is the failure this
          # catches.
          readme_versions=$(grep 'x-release-please-version' README.md \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*' || true)
          if [ -z "$readme_versions" ]; then
            echo "::error file=README.md::no x-release-please-version marker carries a version"
            failed=1
          fi
          while IFS= read -r readme_version; do
            [ -n "$readme_version" ] || continue
            if [ "$readme_version" != "$cargo_version" ]; then
              echo "::error file=README.md::install snippet pins $readme_version but Cargo.toml says $cargo_version"
              failed=1
            fi
          done <<< "$readme_versions"

          if [ -n "$TAG" ]; then
            tag_version="${TAG#v}"
            if [ "$tag_version" != "$cargo_version" ]; then
              echo "::error::tag $TAG does not match Cargo.toml version $cargo_version"
              echo "::error::the tag and the tree it was cut from disagree — re-run release-please"
              failed=1
            fi
          else
            echo "no tag given: skipping the tag comparison (dry run)"
          fi

          [ "$failed" -eq 0 ] || exit 1
          echo "all manifests agree on $cargo_version"
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"

  # A tag carrying a pre-release identifier (v0.2.0-rc.1) must never be "latest", and
  # release-please drafts it as an ordinary Release, so something has to set the flag before
  # the `release` job publishes that draft. It cannot be release-please: its own `prerelease`
  # option is `prerelease && (preRelease || major === 0)`, so enabling it would also mark
  # every 0.x release a pre-release and leave `/releases/latest` — the link the README hands
  # users — with nothing to point at.
  #
  # `build` needs this job, and that edge is load-bearing: a failed `gh release edit` must
  # stop the run before the step that publishes the draft, or an unflagged pre-release would
  # be published straight to "latest". The tag predicate therefore sits on the step rather
  # than on the job — a job skipped by its own `if` would skip `build` along with it, so a
  # stable or dry run has to reach a job that succeeds while doing nothing.
  #
  # This job itself `needs` nothing, which once kept a failing `verify-version` from stranding
  # a pre-release at `/releases/latest`. The draft subsumes that (nothing is published until
  # the final step, which `verify-version` gates through `build`), so what the missing edge
  # buys now is only that this runs alongside `verify-version` rather than after it.
  mark-prerelease:
    name: Mark pre-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Flag the Release as a pre-release
        if: inputs.tag != '' && contains(inputs.tag, '-')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --repo "$REPO" --prerelease

  build:
    name: Build ${{ matrix.target }}
    needs: [verify-version, mark-prerelease]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
    env:
      VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      # The tagged commit, for the reason in verify-version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Must precede the cargo build — rust-embed bakes `dist/` in at compile time.
      - name: Build dashboard
        run: bun run --filter @honmoon/dashboard build

      # Guards the build order: build.rs's placeholder is what a cargo-first run would embed.
      - name: Assert the dashboard is not the build.rs placeholder
        run: |
          set -euo pipefail
          if grep -q 'Dashboard not built' apps/dashboard/dist/index.html; then
            echo "::error::apps/dashboard/dist/index.html is the build.rs placeholder — the dashboard build did not produce a real bundle"
            exit 1
          fi
          echo "dashboard bundle looks real"

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build honmoon
        run: cargo build --release --locked -p honmoon-cli --target ${{ matrix.target }}

      # Native runners only, so the binary just built is runnable here.
      - name: Smoke test
        run: ./target/${{ matrix.target }}/release/honmoon --version

      # `shasum -a 256` rather than sha256sum/openssl: it is present on both the ubuntu and
      # the macOS runners, and emits the coreutils format that both `sha256sum -c` and
      # `shasum -a 256 -c` accept on the user's side.
      - name: Package
        id: package
        run: |
          set -euo pipefail
          archive="honmoon-${VERSION}-${{ matrix.target }}.tar.gz"

          staging="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/honmoon" "$staging/"
          cp LICENSE README.md "$staging/"
          tar -czf "$archive" -C "$staging" honmoon LICENSE README.md

          shasum -a 256 "$archive" > "$archive.sha256"
          cat "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: honmoon-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  release:
    name: Attach binaries to the Release
    needs: [verify-version, build]
    # A dry run passes no tag and stops after the build.
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Combine checksums
        run: |
          set -euo pipefail
          cd artifacts
          cat ./*.tar.gz.sha256 | sort -k2 > SHA256SUMS
          rm -f ./*.tar.gz.sha256
          cat SHA256SUMS
          # Re-verify locally so a corrupted upload cannot become a published asset.
          shasum -a 256 -c SHA256SUMS

      - name: Upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # The Release already exists — release-please drafted it with the CHANGELOG entry
          # as its notes; only the binaries are missing. `--clobber` overwrites an asset of
          # the same name, so redoing a partly-failed upload is safe.
          gh release upload "$TAG" \
            --clobber \
            artifacts/*.tar.gz \
            artifacts/SHA256SUMS

      # The step that ends the release. Everything above can fail without a user ever seeing a
      # Release, because until this runs there is only a draft; that is the whole point of
      # #230, so nothing may be added after it.
      #
      # Only a draft is edited. Re-dispatching this workflow onto a Release that is already
      # published — the documented way to redo a failed upload — must not PATCH it: `gh` sends
      # no `make_latest` either way, and rather than depend on what GitHub does with an absent
      # `make_latest` on an old Release, the request is not sent at all.
      #
      # Addressing the draft as "$TAG" is load-bearing, and it is not an API guarantee:
      # `GET /releases/tags/{tag}` does not return drafts. `gh` covers the gap client-side —
      # `shared.FetchRelease` races that REST lookup against a GraphQL
      # `repository.release(tagName:)` query, which does see drafts, and `view`, `edit` and
      # `upload` all resolve a tag through it. Every `gh` call in this workflow runs on
      # `ubuntu-latest`, whose `gh` is the runner image's and is pinned nowhere here: it was
      # 2.100.0 when this was written, and it will move. `gh release view` therefore runs
      # first, so that an image that ever stops resolving the draft fails this job by name —
      # with the Release still a draft — rather than leaving the behaviour untested. The
      # by-id alternative would be release-please's own `id` output, threaded through
      # release-please.yml and driven with `gh api`; it is not needed while this holds.
      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Read on its own line, not inside the `if` condition. `set -e` does not
          # apply to a command substitution embedded in a condition, so a failing
          # `gh release view` there would read as an empty string, take the `else`
          # branch, and exit 0 — reporting success while leaving the Release a
          # draft nobody publishes, which is the one outcome this step exists to
          # prevent. As a plain assignment the failure aborts the job.
          is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          if [ "$is_draft" = "true" ]; then
            gh release edit "$TAG" --draft=false
            echo "published $TAG"
          else
            echo "$TAG is already published — leaving it as it is"
          fi
