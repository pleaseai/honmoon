name: Deploy Demo (Cloudflare Pages)

# Deploys the fixture-backed dashboard demo (apps/dashboard, built with
# `build:demo`) to Cloudflare Pages (honmoon-demo).
#   - push to main → production deploy (honmoon-demo.pages.dev)
#   - manual run   → deploy of the selected ref; production only when that ref is
#                    the Pages production branch (`main`), otherwise a preview URL
#
# The demo runs with no gateway attached. The app source contains no demo code:
# `build:demo` takes the stock `dist/` produced by the ordinary build and writes
# `dist-demo/` = that exact artifact plus one injected <script> tag loading
# `apps/dashboard/demo/demo-mode.js`, which shims `window.fetch` with in-memory
# fixtures at runtime. `dist/` — what rust-embed bakes into the Rust binary — is
# left byte-identical and can never contain demo code.
#
# Intentionally does NOT run on pull_request: that would expose CLOUDFLARE_API_TOKEN
# to PR-controlled workflow/build code (token exfiltration risk). PR build validation
# is already covered by ci.yml (`bun run build` builds apps/dashboard). Add preview
# deploys later behind a protected GitHub Environment if needed.
#
# One-time setup (see notes at the bottom of this file):
#   Repo secrets: CLOUDFLARE_API_TOKEN (scope: Account › Cloudflare Pages › Edit)
#                 CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches: [main]
    paths:
      - 'apps/dashboard/**'
      - 'packages/policy/**'
      - package.json
      - bun.lock
      - .github/workflows/deploy-demo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy dashboard demo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write # let wrangler-action publish a GitHub deployment
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build dashboard demo
        run: bun run --filter '@honmoon/dashboard' build:demo

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy apps/dashboard/dist-demo
            --project-name=honmoon-demo
            --branch=${{ github.ref_name }}

# ── One-time Cloudflare setup ────────────────────────────────────────────────
# 1. Reuses the same secrets as deploy-web.yml — if that workflow already runs,
#    there is nothing to do here.
# 2. Otherwise: create an API token (Cloudflare dashboard › My Profile › API
#    Tokens › Create Token › "Edit Cloudflare Workers" template, OR a custom
#    token with permission  Account › Cloudflare Pages › Edit), grab your
#    Account ID (dashboard › any domain › right sidebar, or Workers & Pages),
#    and add both as GitHub repo secrets:
#      gh secret set CLOUDFLARE_API_TOKEN
#      gh secret set CLOUDFLARE_ACCOUNT_ID
# 3. The first deploy on `main` auto-creates the `honmoon-demo` Pages project with
#    `main` as its production branch. (Or pre-create it once:
#      bunx wrangler pages project create honmoon-demo --production-branch=main )
