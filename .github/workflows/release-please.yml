name: Release Please

# Owns the version for the whole repo. On every push to `main` release-please maintains a
# release PR that carries one version across Cargo.toml, Cargo.lock, every package.json, the
# Claude plugin manifest, and the README install snippets — the full list is the `extra-files`
# array in release-please-config.json. Merging that PR pushes `refs/tags/vX.Y.Z` and creates
# the GitHub Release with the CHANGELOG entry as its notes.
#
# That Release is created as a **draft** and `release.yml` publishes it once the binaries are
# on it (#230), which is also why the tag is a push of its own: GitHub creates no tag ref for
# a draft Release, so `force-tag-creation` in release-please-config.json is what gives
# release.yml's `refs/tags/` checkouts something to resolve.
#
# release.yml is then invoked directly, by `uses:` rather than by a tag-push trigger. The tag
# release-please creates does raise events (it acts as the org App, not GITHUB_TOKEN), so a
# tag trigger would fire *in addition* to this call and upload the same assets twice.
#
# The App token is also why the release PR gets CI at all: events raised by GITHUB_TOKEN never
# trigger other workflows, so a GITHUB_TOKEN release PR would sit there permanently untested.
#
# Which commits are *eligible* to move the version at all is the `exclude-paths` array in
# release-please-config.json, and the rule behind that list lives here because JSON has no
# comments: release-please fetches the config and `JSON.parse`s it, so a `//` line would fail
# the run rather than document it. On the list are the directories that are not an input to anything
# this version names — `.claude`, `.please`, `datasets`, `docs`, `scripts` and `wiki` reach
# neither the binary, nor the packages under `packages/` and `apps/`, nor the README install
# snippets.
#
# `policies/` is **not** on the list, although nothing links it into the binary either:
# `agent.yaml` is `include_str!`'d only by a `#[cfg(test)]` test and a bench. It stays because
# it is product surface rather than tooling — the README's quickstart runs every one of its
# commands against `policies/agent.yaml`, and the test guarding it is named
# `shipped_example_policy_fires`. A change to the rules a user runs from the documented
# quickstart should cut a release. That asymmetry is how to decide the next doubtful path, too:
# a bump that should not have happened is visible in the release PR and correctable, while a
# bump that should have happened and did not is silent.
#
# A commit is dropped only when **every** file it touches is under one of those paths, which is
# what makes the list safe: `5f3b7dd` (`fix(proxy):`) also edited `scripts/` and `wiki/` and
# still cuts a release, while `71ff6b5` (`feat(scripts):`) touched nothing outside them and no
# longer bumps the minor version of a binary it did not change (#279).
#
# `.github` is deliberately **not** excluded, and the argument is about release.yml alone: it
# decides the archive's contents — its targets, its build flags, what it packages — so a commit
# that changes the release payload without touching a line of source lives there, and excluding
# it would make that change invisible in the release that makes it. release.yml cannot be
# singled out; `exclude-paths` matches whole directories and every workflow file sits directly
# in `.github/workflows/`, so the choice is all of `.github` or none of it.
#
# Keeping all of it in leaves a residual, and it is not the case that sentence covers: ci.yml,
# codspeed.yml, the three deploy-*.yml and dependabot.yml decide nothing about the archive, so
# a commit confined to one of them and typed `feat:` or `fix:` bumps a version for something
# that ships nothing — the same class of commit #279 is about. `ci:` and `build:` are hidden
# types and open no release by themselves, but `feat:` and `fix:` are visible and nothing else
# filters them. That is accepted rather than argued away: there is no path-granular way to keep
# release.yml counted and drop the rest, and losing sight of a change to the release payload is
# the worse of the two failures.
#
# Matching is a literal directory prefix (`wiki/…`), never a glob — `wiki/**` would match no
# file at all, and a renamed directory silently stops excluding anything. Neither failure is
# loud; the only symptom is a version that moves when it should not.

on:
  push:
    branches: [main]

# The App token carries every write permission this needs; GITHUB_TOKEN needs none.
permissions: {}

concurrency:
  # Never cancel: an interrupted run can leave a tag without its binaries.
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain the release PR
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_GITHUB_APP_PRIVATE_KEY }}
          # Without these the token carries every permission the App installation holds.
          # All three are load-bearing: `createReleases()` swaps the release PR's
          # `autorelease:` label through the issues API after tagging, un-caught, so a token
          # without `issues` throws once the tag and Release already exist and before the
          # action sets its outputs — leaving `publish-binaries` skipped, and with it a tag
          # and a draft Release that no run has published. Recover by dispatching release.yml
          # with that tag, not by re-running this workflow: the Release already exists, so
          # `createReleases()` raises DuplicateReleaseError, relabels the PR `autorelease:
          # tagged` and rethrows, and `publish-binaries` is skipped a second time. Invisible
          # to users throughout, but still a release that did not happen.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Only reached on the push that merges the release PR. `tag_name` is unprefixed because the
  # released package sits at the manifest root — a nested one would be `<path>--tag_name`.
  publish-binaries:
    name: Publish binaries
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
